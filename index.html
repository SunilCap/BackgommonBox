<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#241408">
<meta name="description" content="Play standard backgammon — pass-and-play, full rules, installable as an app.">
<title>Backgammon</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --walnut-dark:#1c0f08;
  --walnut:#2e1a0e;
  --walnut-light:#4a2a16;
  --rail:#120a05;
  --felt:#0c2419;
  --felt-dark:#081b12;
  --cream:#e9dcc0;
  --cream-dim:#d8c8a4;
  --wine:#7c2233;
  --wine-dark:#5e1926;
  --brass:#c19a55;
  --brass-bright:#e0bd7d;
  --checker-w:#f4ecd8;
  --checker-w-shadow:#a3906a;
  --checker-b:#1a1310;
  --checker-b-shadow:#000;
  --ink:#f4ecd8;
  --ink-dim:#c9b990;
  --danger:#c0392b;
  --font-display:'Fraunces', serif;
  --font-body:'Inter', system-ui, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  height:100vh;
  height:100dvh;
  background:
    radial-gradient(ellipse at 50% -10%, #1a3a2a 0%, var(--felt) 45%, var(--felt-dark) 100%);
  color:var(--ink);
  font-family:var(--font-body);
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
  touch-action:manipulation;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ---------- compact top bar (title + turn + pips in one strip) ---------- */
.top-bar{
  flex:0 0 auto;
  width:100%;
  padding:8px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.top-bar h1{
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(15px,2.6vw,19px);
  letter-spacing:0.02em;
  margin:0;
  color:var(--brass-bright);
  text-shadow:0 1px 0 rgba(0,0,0,.5);
  white-space:nowrap;
}
.top-bar-right{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.turn-pill{
  display:flex;
  align-items:center;
  gap:7px;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(193,154,85,.35);
  border-radius:999px;
  padding:4px 12px 4px 7px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
.turn-pill .dot{
  width:13px;height:13px;border-radius:50%;
  border:2px solid var(--brass);
}
.turn-pill .dot.w{background:radial-gradient(circle at 35% 30%, var(--checker-w), var(--checker-w-shadow));}
.turn-pill .dot.b{background:radial-gradient(circle at 35% 30%, #3a2f28, var(--checker-b));}
.pips{
  display:flex; gap:12px; font-size:11px; color:var(--ink-dim); white-space:nowrap;
}
.pips b{color:var(--ink); font-weight:700;}

/* ---------- board ---------- */
.board-wrap{
  flex:1 1 auto;
  min-height:0;
  min-width:0;
  width:100%;
  padding:2px 8px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.board-frame{
  background:linear-gradient(160deg,var(--walnut-light),var(--walnut) 55%,var(--walnut-dark));
  border-radius:14px;
  padding:14px;
  box-shadow:0 18px 40px rgba(0,0,0,.55), inset 0 0 0 2px var(--rail), inset 0 0 24px rgba(0,0,0,.5);
  display:flex;
  gap:10px;
  /* width/height are set precisely by JS (fitBoard) to fill available space
     on any screen while keeping the board's proportions correct */
}
.board-core{
  flex:1 1 auto;
  display:grid;
  grid-template-rows:1fr auto 1fr;
  background:var(--rail);
  border-radius:6px;
  padding:8px;
  box-shadow:inset 0 0 0 2px rgba(193,154,85,.4), inset 0 4px 18px rgba(0,0,0,.6);
  gap:6px;
  min-width:0;
  min-height:0;
  height:100%;
}
.row{
  display:grid;
  grid-template-columns:repeat(6,1fr) 0.55fr repeat(6,1fr);
  gap:2px;
  min-height:0;
}
.row.top{align-items:start;}
.row.bottom{align-items:end;}

.point{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:0;
  cursor:pointer;
}
.row.top .point{justify-content:flex-start;}
.row.bottom .point{justify-content:flex-end; flex-direction:column-reverse;}

.tri{
  position:absolute;
  left:8%; right:8%;
  top:0; bottom:0;
  clip-path:polygon(0% 0%, 100% 0%, 50% 100%);
  opacity:.94;
  transition:filter .15s;
}
.row.bottom .tri{clip-path:polygon(0% 100%, 100% 100%, 50% 0%);}
.point.cream .tri{background:linear-gradient(180deg,var(--cream),var(--cream-dim));}
.point.wine .tri{background:linear-gradient(180deg,var(--wine),var(--wine-dark));}
.point.highlight .tri{filter:brightness(1.35) saturate(1.2); box-shadow:0 0 0 2px var(--brass-bright);}
.point.selected .tri{filter:brightness(1.5); box-shadow:0 0 0 2px #fff;}

.point-label{
  position:absolute;
  font-size:9px;
  color:rgba(233,220,192,.55);
  font-weight:600;
  left:50%; transform:translateX(-50%);
}
.row.top .point-label{top:2px;}
.row.bottom .point-label{bottom:2px;}

.checkers{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
  padding:2px 0;
}
.row.bottom .checkers{flex-direction:column-reverse;}

.checker{
  width:78%;
  aspect-ratio:1/1;
  max-width:64px;
  border-radius:50%;
  margin-top:-38%;
  box-shadow:0 2px 3px rgba(0,0,0,.55), inset 0 2px 3px rgba(255,255,255,.25), inset 0 -3px 4px rgba(0,0,0,.35);
  position:relative;
}
.row.bottom .checker{margin-top:0; margin-bottom:-38%;}
.checkers .checker:first-child{margin-top:0; margin-bottom:0;}
.checker.w{background:radial-gradient(circle at 35% 28%, var(--checker-w), var(--checker-w-shadow));border:1px solid #8c7a54;}
.checker.b{background:radial-gradient(circle at 35% 28%, #3f342b, var(--checker-b));border:1px solid #000;}
.checker.top-count{
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; font-family:var(--font-body);
}
.checker.w.top-count{color:var(--walnut-dark);}
.checker.b.top-count{color:var(--cream);}

/* bar */
.bar{
  grid-row:1/4;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:center;
  padding:10px 2px;
  position:relative;
}
.bar::before{
  content:"";
  position:absolute; inset:0 40%;
  background:linear-gradient(180deg,var(--walnut-light),var(--walnut));
  border-radius:4px;
  box-shadow:inset 0 0 0 1px rgba(193,154,85,.4);
}
.bar-stack{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:2px; min-height:20px; cursor:pointer; border-radius:8px;}
.bar-stack.highlight{box-shadow:0 0 0 2px var(--brass-bright); background:rgba(224,189,125,.15);}
.bar .checker{margin:0 !important; width:60%; max-width:46px;}
.bar-mid{
  position:relative; z-index:2;
  font-family:var(--font-display); color:var(--brass); font-size:11px; letter-spacing:.2em;
  writing-mode:vertical-rl; text-orientation:mixed; opacity:.55;
}

.middle-row{min-height:2px;}

/* off trays */
.off-col{
  width:15%;
  min-width:44px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.off-tray{
  flex:1;
  background:linear-gradient(160deg,var(--walnut-light),var(--walnut-dark));
  border-radius:8px;
  box-shadow:inset 0 0 0 2px rgba(193,154,85,.35), inset 0 0 14px rgba(0,0,0,.5);
  display:flex;
  flex-wrap:wrap;
  align-content:flex-start;
  gap:2px;
  padding:6px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}
.off-tray.highlight{box-shadow:inset 0 0 0 2px var(--brass-bright), 0 0 10px var(--brass-bright);}
.off-tray .checker{width:22%; max-width:24px; margin:0;}
.off-tray .label{position:absolute; bottom:2px; right:5px; font-size:9px; color:var(--ink-dim); font-family:var(--font-body);}

/* ---------- dice / controls ---------- */
.controls{
  flex:0 0 auto;
  width:100%;
  padding:6px 16px calc(8px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}
.dice-area{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:40px;
}
.die{
  width:36px; height:36px;
  border-radius:8px;
  background:linear-gradient(160deg,var(--cream),var(--cream-dim));
  box-shadow:0 4px 10px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.6);
  display:flex; align-items:center; justify-content:center;
  font-size:23px;
  color:var(--walnut-dark);
  transition:transform .15s;
}
.die.used{opacity:.28; filter:grayscale(.6);}
.die.rolling{animation:spin .5s linear infinite;}
@keyframes spin{ from{transform:rotate(0deg) scale(1);} 50%{transform:rotate(180deg) scale(1.08);} to{transform:rotate(360deg) scale(1);} }

.btn-row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
button{
  font-family:var(--font-body);
  font-weight:600;
  font-size:13px;
  border:none;
  border-radius:999px;
  padding:9px 18px;
  cursor:pointer;
  letter-spacing:.02em;
  transition:transform .08s, filter .15s;
  -webkit-tap-highlight-color:transparent;
}
button:active{transform:scale(.96);}
button:disabled{opacity:.35; cursor:default; transform:none;}
.btn-primary{background:linear-gradient(160deg,var(--brass-bright),var(--brass)); color:var(--walnut-dark); box-shadow:0 4px 12px rgba(193,154,85,.35);}
.btn-ghost{background:rgba(255,255,255,.06); color:var(--ink); border:1px solid rgba(233,220,192,.25);}
.btn-ghost:hover{background:rgba(255,255,255,.1);}

.message{
  min-height:16px;
  font-size:12px;
  color:var(--brass-bright);
  text-align:center;
  font-weight:600;
  letter-spacing:.01em;
}

/* ---------- overlay ---------- */
.overlay{
  position:fixed; inset:0;
  background:rgba(8,6,4,.82);
  display:flex; align-items:center; justify-content:center;
  z-index:50;
  padding:20px;
}
.overlay.hidden{display:none;}
.overlay-card{
  background:linear-gradient(160deg,var(--walnut-light),var(--walnut-dark));
  border-radius:16px;
  padding:32px 28px;
  max-width:360px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.6), inset 0 0 0 1px rgba(193,154,85,.4);
}
.overlay-card h2{
  font-family:var(--font-display);
  color:var(--brass-bright);
  font-size:26px;
  margin:0 0 10px;
}
.overlay-card p{color:var(--ink-dim); font-size:14px; line-height:1.5; margin:0 0 20px;}

.rotate-hint{
  display:none;
  position:fixed; inset:0; z-index:60;
  background:rgba(8,6,4,.95);
  color:var(--ink); flex-direction:column; align-items:center; justify-content:center;
  gap:14px; text-align:center; padding:30px; font-family:var(--font-body);
}
.rotate-hint svg{width:56px;height:56px;}
@media (max-width:520px) and (orientation:portrait){
  .rotate-hint{display:flex;}
}

</style>
</head>
<body>

<div class="rotate-hint">
  <svg viewBox="0 0 24 24" fill="none" stroke="#e0bd7d" stroke-width="1.6"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M2 8v8M22 8v8" stroke-linecap="round"/></svg>
  <div style="font-family:var(--font-display); font-size:18px; color:var(--brass-bright);">Rotate your phone</div>
  <div style="font-size:13px; color:var(--ink-dim); max-width:240px;">The board reads best in landscape. Turn your device sideways to play.</div>
  <button class="btn-ghost" onclick="document.querySelector('.rotate-hint').style.display='none'">Play in portrait anyway</button>
</div>

<div class="top-bar">
  <h1>Backgammon</h1>
  <div class="top-bar-right">
    <div class="turn-pill" id="turnPill">
      <span class="dot w" id="turnDot"></span>
      <span id="turnText">White to roll</span>
    </div>
    <div class="pips">
      <span>W <b id="pipW">167</b></span>
      <span>B <b id="pipB">167</b></span>
    </div>
  </div>
</div>

<div class="board-wrap" id="boardWrap">
  <div class="board-frame" id="boardFrame">
    <div class="board-core" id="boardCore">
      <div class="row top" id="rowTop"></div>
      <div class="row middle-row" id="barRow"></div>
      <div class="row bottom" id="rowBottom"></div>
    </div>
    <div class="off-col">
      <div class="off-tray" id="offB"><span class="label">Black off</span></div>
      <div class="off-tray" id="offW"><span class="label">White off</span></div>
    </div>
  </div>
</div>

<div class="controls">
  <div class="dice-area" id="diceArea"></div>
  <div class="message" id="message">Roll the dice to begin.</div>
  <div class="btn-row">
    <button class="btn-primary" id="rollBtn">Roll Dice</button>
    <button class="btn-ghost" id="undoBtn" disabled>Undo Move</button>
    <button class="btn-ghost" id="newBtn">New Game</button>
  </div>
</div>

<div class="overlay hidden" id="winOverlay">
  <div class="overlay-card">
    <h2 id="winTitle">White wins!</h2>
    <p id="winSub">All fifteen checkers borne off. Well played.</p>
    <button class="btn-primary" id="playAgainBtn">Play Again</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ================= GAME STATE ================= */
const DIE_FACES = {1:'⚀',2:'⚁',3:'⚂',4:'⚃',5:'⚄',6:'⚅'};

function freshState(){
  const points = new Array(25).fill(null).map(()=>({owner:null,count:0}));
  points[24] = {owner:'w', count:2};
  points[13] = {owner:'w', count:5};
  points[8]  = {owner:'w', count:3};
  points[6]  = {owner:'w', count:5};
  points[1]  = {owner:'b', count:2};
  points[12] = {owner:'b', count:5};
  points[17] = {owner:'b', count:3};
  points[19] = {owner:'b', count:5};
  return {
    points,
    bar:{w:0,b:0},
    off:{w:0,b:0},
    current:'w',
    dice:[],          // remaining usable die values this turn
    rolledPair:[],     // the two numbers actually rolled (for dice UI, incl. doubles shown as 2)
    turnRolled:false,
    selected:null,     // 'bar' or point number (1-24)
    gameOver:false,
    history:[],        // snapshots for undo (per move, within current turn)
    passMessage:null
  };
}

let S = freshState();

function opp(p){ return p==='w' ? 'b' : 'w'; }
function dist(player, p){ return player==='w' ? p : 25-p; }
function homeMin(player){ return player==='w' ? 1 : 19; }
function homeMax(player){ return player==='w' ? 6 : 24; }
function inHome(player,p){ return p>=homeMin(player) && p<=homeMax(player); }

function isAllHome(player){
  if(S.bar[player] > 0) return false;
  for(let p=1;p<=24;p++){
    const pt = S.points[p];
    if(pt.owner===player && pt.count>0 && !inHome(player,p)) return false;
  }
  return true;
}

function destinationFor(player, src, die){
  if(src==='bar') return player==='w' ? 25-die : die;
  return player==='w' ? src-die : src+die;
}

function canLandOn(player, dest){
  const pt = S.points[dest];
  return pt.count===0 || pt.owner===player || (pt.count===1 && pt.owner===opp(player));
}

function maxHomeDist(player){
  let m=0;
  for(let p=1;p<=24;p++){
    const pt=S.points[p];
    if(pt.owner===player && pt.count>0) m = Math.max(m, dist(player,p));
  }
  return m;
}

// Returns array of legal moves for `player` given the array of currently
// available die values (duplicates allowed for doubles, but we only need
// the distinct values to know what's playable from a square).
function getLegalMoves(player, diceValues){
  const moves = [];
  const uniq = [...new Set(diceValues)];
  if(uniq.length===0) return moves;

  if(S.bar[player] > 0){
    for(const die of uniq){
      const dest = destinationFor(player,'bar',die);
      if(canLandOn(player,dest)){
        moves.push({src:'bar', die, dest, hit: S.points[dest].count===1 && S.points[dest].owner===opp(player)});
      }
    }
    return moves; // must enter from the bar before anything else
  }

  const home = isAllHome(player);
  const maxD = home ? maxHomeDist(player) : 0;

  for(let p=1;p<=24;p++){
    const pt = S.points[p];
    if(pt.owner!==player || pt.count===0) continue;
    for(const die of uniq){
      const dest = destinationFor(player,p,die);
      if(dest>=1 && dest<=24){
        if(canLandOn(player,dest)){
          moves.push({src:p, die, dest, hit: S.points[dest].count===1 && S.points[dest].owner===opp(player)});
        }
      } else if(home){
        const d = dist(player,p);
        if(die===d || (die>d && d===maxD)){
          moves.push({src:p, die, dest:'off', hit:false});
        }
      }
    }
  }
  return moves;
}

function snapshot(){
  return JSON.parse(JSON.stringify({
    points:S.points, bar:S.bar, off:S.off, current:S.current, dice:S.dice,
    rolledPair:S.rolledPair, turnRolled:S.turnRolled, selected:S.selected
  }));
}

function pushHistory(){
  S.history.push(snapshot());
}

function undoMove(){
  if(S.history.length===0) return;
  const snap = S.history.pop();
  S.points = snap.points; S.bar = snap.bar; S.off = snap.off; S.current = snap.current;
  S.dice = snap.dice; S.rolledPair = snap.rolledPair; S.turnRolled = snap.turnRolled;
  S.selected = null;
  setMessage('Move undone.');
  render();
}

function applyMove(move){
  pushHistory();
  const player = S.current;
  if(move.src==='bar') S.bar[player]--;
  else{
    S.points[move.src].count--;
    if(S.points[move.src].count===0) S.points[move.src].owner=null;
  }
  if(move.dest==='off'){
    S.off[player]++;
  } else {
    const pt = S.points[move.dest];
    if(pt.count===1 && pt.owner===opp(player)){
      S.bar[opp(player)]++;
      pt.owner = player; pt.count = 1;
    } else {
      pt.owner = player; pt.count++;
    }
  }
  const idx = S.dice.indexOf(move.die);
  S.dice.splice(idx,1);
}

function checkWinner(){
  if(S.off.w===15) return 'w';
  if(S.off.b===15) return 'b';
  return null;
}

/* ================= TURN FLOW ================= */
function startRoll(){
  if(S.gameOver || S.turnRolled) return;
  const dice = document.querySelectorAll('.die');
  rollBtn.disabled = true;
  let ticks = 0;
  const spin = setInterval(()=>{
    dice.forEach(d=>d.textContent = DIE_FACES[1+Math.floor(Math.random()*6)]);
    ticks++;
    if(ticks>7){
      clearInterval(spin);
      finishRoll();
    }
  },60);
}

function finishRoll(){
  const a = 1+Math.floor(Math.random()*6);
  const b = 1+Math.floor(Math.random()*6);
  S.rolledPair = [a,b];
  S.dice = (a===b) ? [a,a,a,a] : [a,b];
  S.turnRolled = true;
  S.selected = null;
  S.history = [];

  const legal = getLegalMoves(S.current, S.dice);
  if(legal.length===0){
    setMessage(`${playerName(S.current)} rolled ${a}-${b} — no legal moves. Turn passes.`);
    render();
    setTimeout(()=>{ switchTurn(); render(); }, 1400);
  } else {
    setMessage(`${playerName(S.current)} rolled ${a}-${b}${a===b?' (doubles!)':''}. Select a checker to move.`);
    render();
  }
}

function switchTurn(){
  S.current = opp(S.current);
  S.dice = [];
  S.rolledPair = [];
  S.turnRolled = false;
  S.selected = null;
  S.history = [];
  if(!S.gameOver) setMessage(`${playerName(S.current)} to roll.`);
}

function afterMove(){
  const winner = checkWinner();
  if(winner){
    S.gameOver = true;
    showWin(winner);
    render();
    return;
  }
  const legal = getLegalMoves(S.current, S.dice);
  if(S.dice.length===0){
    setMessage(`${playerName(S.current)}'s turn is complete.`);
    setTimeout(()=>{ switchTurn(); render(); }, 700);
  } else if(legal.length===0){
    setMessage(`No more legal moves for ${playerName(S.current)}. Turn passes.`);
    setTimeout(()=>{ switchTurn(); render(); }, 1200);
  } else {
    setMessage('Select your next move.');
  }
  render();
}

function playerName(p){ return p==='w' ? 'White' : 'Black'; }

/* ================= INTERACTION ================= */
function onPointClick(p){
  if(S.gameOver || !S.turnRolled) { if(!S.turnRolled) setMessage('Roll the dice first.'); return; }
  const player = S.current;

  if(S.bar[player] > 0){
    if(p==='bar'){
      S.selected = 'bar';
      render();
      return;
    }
    const moves = getLegalMoves(player, S.dice).filter(m=>m.src==='bar');
    const hit = moves.find(m=>m.dest===p);
    if(S.selected==='bar' && hit){
      applyMove(hit);
      afterMove();
    } else {
      setMessage('You must enter from the bar first.');
    }
    return;
  }

  if(p==='bar') return;

  const pt = S.points[p];
  if(S.selected===null){
    if(pt.owner===player && pt.count>0){
      S.selected = p;
      render();
    }
    return;
  }

  if(S.selected===p){
    S.selected = null;
    render();
    return;
  }

  const moves = getLegalMoves(player, S.dice).filter(m=>m.src===S.selected);
  const move = moves.find(m=>m.dest===p);
  if(move){
    applyMove(move);
    afterMove();
    return;
  }

  if(pt.owner===player && pt.count>0){
    S.selected = p;
    render();
    return;
  }

  setMessage('That move isn\'t legal.');
}

function onOffClick(player){
  if(S.gameOver || !S.turnRolled) return;
  if(player !== S.current) return;
  if(S.selected===null) return;
  const moves = getLegalMoves(S.current, S.dice).filter(m=>m.src===S.selected);
  const move = moves.find(m=>m.dest==='off');
  if(move){
    applyMove(move);
    afterMove();
  } else {
    setMessage('You can only bear off once all your checkers are home.');
  }
}

/* ================= RENDER ================= */
const rowTop = document.getElementById('rowTop');
const rowBottom = document.getElementById('rowBottom');
const barRow = document.getElementById('barRow');
const offWEl = document.getElementById('offW');
const offBEl = document.getElementById('offB');
const diceArea = document.getElementById('diceArea');
const messageEl = document.getElementById('message');
const rollBtn = document.getElementById('rollBtn');
const undoBtn = document.getElementById('undoBtn');
const newBtn = document.getElementById('newBtn');
const turnText = document.getElementById('turnText');
const turnDot = document.getElementById('turnDot');
const pipWEl = document.getElementById('pipW');
const pipBEl = document.getElementById('pipB');
const winOverlay = document.getElementById('winOverlay');

const TOP_POINTS = [13,14,15,16,17,18,'BAR',19,20,21,22,23,24];
const BOTTOM_POINTS = [12,11,10,9,8,7,'BAR',6,5,4,3,2,1];

function setMessage(msg){ S.passMessage = msg; messageEl.textContent = msg; }

function currentLegalTargets(){
  if(S.selected===null || !S.turnRolled) return [];
  const moves = getLegalMoves(S.current, S.dice).filter(m=>m.src===S.selected);
  return moves.map(m=>m.dest);
}

function makeCheckerStack(owner, count, capForBadge){
  const frag = document.createDocumentFragment();
  const max = capForBadge || 5;
  const show = Math.min(count, max);
  for(let i=0;i<show;i++){
    const c = document.createElement('div');
    c.className = 'checker ' + owner;
    if(i===show-1 && count>max){
      c.classList.add('top-count');
      c.textContent = count;
    }
    frag.appendChild(c);
  }
  return frag;
}

function buildPointEl(pNum, isTop, targets){
  const div = document.createElement('div');
  const idx = TOP_POINTS.indexOf(pNum)>=0 ? TOP_POINTS.indexOf(pNum) : BOTTOM_POINTS.indexOf(pNum);
  const colorClass = (idx % 2 === 0) ? 'cream' : 'wine';
  div.className = 'point ' + colorClass;
  if(S.selected===pNum) div.classList.add('selected');
  if(targets.includes(pNum)) div.classList.add('highlight');

  const tri = document.createElement('div');
  tri.className = 'tri';
  div.appendChild(tri);

  const label = document.createElement('div');
  label.className = 'point-label';
  label.textContent = pNum;
  div.appendChild(label);

  const stack = document.createElement('div');
  stack.className = 'checkers';
  const pt = S.points[pNum];
  if(pt.count>0){
    stack.appendChild(makeCheckerStack(pt.owner, pt.count, 5));
  }
  div.appendChild(stack);

  div.addEventListener('click', ()=>onPointClick(pNum));
  return div;
}

function render(){
  rowTop.innerHTML = '';
  rowBottom.innerHTML = '';
  barRow.innerHTML = '';

  const targets = currentLegalTargets();
  const offTarget = targets.includes('off');

  TOP_POINTS.forEach(p=>{
    if(p==='BAR'){
      rowTop.appendChild(buildBarCell(true, targets));
    } else {
      rowTop.appendChild(buildPointEl(p, true, targets));
    }
  });
  BOTTOM_POINTS.forEach(p=>{
    if(p==='BAR'){
      rowBottom.appendChild(buildBarCell(false, targets));
    } else {
      rowBottom.appendChild(buildPointEl(p, false, targets));
    }
  });

  // off trays
  offWEl.querySelectorAll('.checker').forEach(e=>e.remove());
  offBEl.querySelectorAll('.checker').forEach(e=>e.remove());
  if(S.off.w>0) offWEl.insertBefore(makeCheckerStack('w', S.off.w, 15), offWEl.firstChild);
  if(S.off.b>0) offBEl.insertBefore(makeCheckerStack('b', S.off.b, 15), offBEl.firstChild);
  offWEl.classList.toggle('highlight', S.selected!==null && S.current==='w' && offTarget);
  offBEl.classList.toggle('highlight', S.selected!==null && S.current==='b' && offTarget);

  // dice
  diceArea.innerHTML = '';
  if(S.turnRolled){
    const values = S.rolledPair.length===2 && S.rolledPair[0]===S.rolledPair[1]
      ? [S.rolledPair[0],S.rolledPair[0],S.rolledPair[0],S.rolledPair[0]]
      : S.rolledPair;
    const remaining = [...S.dice];
    values.forEach(v=>{
      const die = document.createElement('div');
      die.className = 'die';
      die.textContent = DIE_FACES[v] || v;
      const at = remaining.indexOf(v);
      if(at>=0){ remaining.splice(at,1); } else { die.classList.add('used'); }
      diceArea.appendChild(die);
    });
  } else {
    for(let i=0;i<2;i++){
      const die = document.createElement('div');
      die.className = 'die';
      die.textContent = '';
      diceArea.appendChild(die);
    }
  }

  // status
  turnText.textContent = S.gameOver ? 'Game over' : (S.turnRolled ? `${playerName(S.current)} to move` : `${playerName(S.current)} to roll`);
  turnDot.className = 'dot ' + S.current;
  rollBtn.disabled = S.gameOver || S.turnRolled;
  undoBtn.disabled = S.history.length===0 || S.gameOver;
  pipWEl.textContent = pipCount('w');
  pipBEl.textContent = pipCount('b');
}

function buildBarCell(isTop, targets){
  const wrap = document.createElement('div');
  wrap.className = 'bar';
  const label = document.createElement('div');
  label.className = 'bar-mid';
  label.textContent = 'BAR';

  const topOwner = isTop ? 'b' : null;
  // We show both stacks in one bar column (split across the two halves)
  const stackTop = document.createElement('div');
  stackTop.className = 'bar-stack';
  const stackBottom = document.createElement('div');
  stackBottom.className = 'bar-stack';

  if(isTop){
    // top half of board shows black's bar checkers (their reentry is below, but visually parking here)
    if(S.bar.b>0) stackTop.appendChild(makeCheckerStack('b', S.bar.b, 6));
    stackTop.addEventListener('click', ()=>{ if(S.current==='b') onPointClick('bar'); });
    if(S.current==='b' && S.bar.b>0 && S.selected==='bar') stackTop.classList.add('highlight');
    else if(S.current==='b' && S.bar.b>0 && targets.length===0 && S.selected===null) stackTop.classList.add('highlight');
    wrap.appendChild(stackTop);
    wrap.appendChild(label);
  } else {
    if(S.bar.w>0) stackBottom.appendChild(makeCheckerStack('w', S.bar.w, 6));
    stackBottom.addEventListener('click', ()=>{ if(S.current==='w') onPointClick('bar'); });
    if(S.current==='w' && S.bar.w>0 && S.selected==='bar') stackBottom.classList.add('highlight');
    else if(S.current==='w' && S.bar.w>0 && targets.length===0 && S.selected===null) stackBottom.classList.add('highlight');
    wrap.appendChild(label);
    wrap.appendChild(stackBottom);
  }
  return wrap;
}

function pipCount(player){
  let total = S.bar[player] * 25;
  for(let p=1;p<=24;p++){
    const pt = S.points[p];
    if(pt.owner===player) total += pt.count * dist(player,p);
  }
  return total;
}

function showWin(winner){
  document.getElementById('winTitle').textContent = playerName(winner) + ' wins!';
  document.getElementById('winSub').textContent = 'All fifteen checkers borne off. Well played.';
  winOverlay.classList.remove('hidden');
}

/* ================= WIRE UP ================= */
rollBtn.addEventListener('click', startRoll);
undoBtn.addEventListener('click', undoMove);
newBtn.addEventListener('click', ()=>{
  S = freshState();
  winOverlay.classList.add('hidden');
  setMessage('Roll the dice to begin.');
  render();
});
document.getElementById('playAgainBtn').addEventListener('click', ()=>{
  S = freshState();
  winOverlay.classList.add('hidden');
  setMessage('Roll the dice to begin.');
  render();
});
offWEl.addEventListener('click', ()=>onOffClick('w'));
offBEl.addEventListener('click', ()=>onOffClick('b'));

render();

/* ================= FIT BOARD TO SCREEN ================= */
// Sizes the board frame in real pixels so it fills whichever dimension
// (width or height) is the limiting one — on a tall narrow phone that's
// width, on a short landscape phone or a wide desktop window it's height.
const boardWrap = document.getElementById('boardWrap');
const boardFrame = document.getElementById('boardFrame');
const FRAME_ASPECT = 1.78;     // outer width:height ratio of the whole board+off-trays
const FRAME_MAX_WIDTH = 1600;  // sanity cap so huge monitors don't get an absurdly large board

function fitBoard(){
  const cs = getComputedStyle(boardWrap);
  const availW = boardWrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = boardWrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if(availW <= 0 || availH <= 0) return;

  let w = availW;
  let h = w / FRAME_ASPECT;
  if(h > availH){
    h = availH;
    w = h * FRAME_ASPECT;
  }
  if(w > FRAME_MAX_WIDTH){
    w = FRAME_MAX_WIDTH;
    h = w / FRAME_ASPECT;
  }
  boardFrame.style.width = Math.floor(w) + 'px';
  boardFrame.style.height = Math.floor(h) + 'px';
}

// Re-fit whenever the available space changes: window resize, orientation
// change, or the header/controls strips changing height (e.g. a longer
// status message wrapping to two lines).
const fitObserver = new ResizeObserver(fitBoard);
fitObserver.observe(boardWrap);
window.addEventListener('orientationchange', ()=>setTimeout(fitBoard,60));

/* ================= PWA: service worker ================= */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{ /* offline registration may fail in sandboxed preview */ });
  });
}
})();
</script>
