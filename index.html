<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#241408">
<meta name="description" content="Play standard backgammon — pass-and-play, full rules, installable as an app.">
<title>Backgammon</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --walnut-dark:#1c0f08;
  --walnut:#2e1a0e;
  --walnut-light:#4a2a16;
  --rail:#120a05;
  --felt:#0c2419;
  --felt-dark:#081b12;
  --cream:#e9dcc0;
  --cream-dim:#d8c8a4;
  --wine:#7c2233;
  --wine-dark:#5e1926;
  --brass:#c19a55;
  --brass-bright:#e0bd7d;
  --checker-w:#f4ecd8;
  --checker-w-shadow:#a3906a;
  --checker-b:#1a1310;
  --checker-b-shadow:#000;
  --ink:#f4ecd8;
  --ink-dim:#c9b990;
  --active-glow:#7fd88f;
  --font-display:'Fraunces', serif;
  --font-body:'Inter', system-ui, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  height:100vh;
  height:100dvh;
  background:
    radial-gradient(ellipse at 50% -10%, #1a3a2a 0%, var(--felt) 45%, var(--felt-dark) 100%);
  color:var(--ink);
  font-family:var(--font-body);
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
  touch-action:manipulation;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ---------- portrait-only hint ---------- */
.portrait-hint{
  display:none;
  position:fixed; inset:0; z-index:60;
  background:rgba(8,6,4,.95);
  color:var(--ink); flex-direction:column; align-items:center; justify-content:center;
  gap:14px; text-align:center; padding:30px; font-family:var(--font-body);
}
.portrait-hint svg{width:56px;height:56px;}
@media (orientation:landscape) and (max-height:520px){
  .portrait-hint.show{display:flex;}
}

/* ---------- table ---------- */
.table-wrap{
  flex:1 1 auto;
  min-height:0;
  width:100%;
  max-width:560px;
  display:flex;
  flex-direction:column;
  padding:6px 10px;
  gap:6px;
}

/* ---------- player cards ---------- */
.player-card{
  flex:0 0 auto;
  align-self:flex-start;
  display:flex;
  align-items:center;
  gap:9px;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(193,154,85,.3);
  border-radius:14px;
  padding:6px 14px 6px 6px;
}
.avatar-ring{
  width:38px; height:38px;
  border-radius:50%;
  border:2.5px solid rgba(233,220,192,.25);
  display:flex; align-items:center; justify-content:center;
  transition:border-color .2s, box-shadow .2s;
  flex:0 0 auto;
}
.avatar-ring.active{
  border-color:var(--active-glow);
  box-shadow:0 0 10px rgba(127,216,143,.6);
}
.avatar{width:26px; height:26px; border-radius:50%;}
.avatar.w{background:radial-gradient(circle at 35% 28%, var(--checker-w), var(--checker-w-shadow)); border:1px solid #8c7a54;}
.avatar.b{background:radial-gradient(circle at 35% 28%, #3f342b, var(--checker-b)); border:1px solid #000;}
.card-name{
  font-family:var(--font-display);
  font-weight:600;
  font-size:13px;
  color:var(--brass-bright);
  line-height:1.2;
}
.card-sub{font-size:11px; color:var(--ink-dim); line-height:1.3;}
.card-sub b{color:var(--ink); font-weight:700;}

/* ---------- boards row ---------- */
.boards-row{
  flex:1 1 auto;
  min-height:0;
  width:100%;
  display:flex;
  flex-direction:row;
  gap:5px;
}

.panel{
  flex:1 1 0;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:linear-gradient(160deg,var(--walnut-light),var(--walnut) 55%,var(--walnut-dark));
  border-radius:12px;
  padding:6px;
  gap:5px;
  box-shadow:0 10px 24px rgba(0,0,0,.5), inset 0 0 0 2px var(--rail), inset 0 0 16px rgba(0,0,0,.45);
  overflow:hidden;
}

.tri-row{
  flex:1 1 0;
  min-height:0;
  min-width:0;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:2px;
  background:var(--rail);
  border-radius:5px;
  padding:5px;
  overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(193,154,85,.35), inset 0 3px 12px rgba(0,0,0,.55);
}
.tri-row.top{align-items:stretch;}
.tri-row.bottom{align-items:stretch;}

.panel-mid{
  flex:0 0 auto;
  min-height:44px;
  min-width:0;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:2px;
}

.point{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:0;
  overflow:hidden;
  cursor:pointer;
  touch-action:none;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
}
.tri-row.top .point{justify-content:flex-start;}
.tri-row.bottom .point{justify-content:flex-end; flex-direction:column-reverse;}

.tri{
  position:absolute;
  left:6%; right:6%;
  top:0; bottom:0;
  clip-path:polygon(0% 0%, 100% 0%, 50% 100%);
  opacity:.94;
  transition:filter .15s;
}
.tri-row.bottom .tri{clip-path:polygon(0% 100%, 100% 100%, 50% 0%);}
.point.cream .tri{background:linear-gradient(180deg,var(--cream),var(--cream-dim));}
.point.wine .tri{background:linear-gradient(180deg,var(--wine),var(--wine-dark));}
.point.highlight .tri{filter:brightness(1.35) saturate(1.2); box-shadow:0 0 0 2px var(--brass-bright);}
.point.selected .tri{filter:brightness(1.5); box-shadow:0 0 0 2px #fff;}

.target-badge{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  z-index:5;
  background:linear-gradient(160deg,var(--brass-bright),var(--brass));
  color:var(--walnut-dark);
  font-family:var(--font-body);
  font-weight:800;
  font-size:11px;
  line-height:1;
  padding:4px 6px;
  border-radius:999px;
  box-shadow:0 2px 8px rgba(0,0,0,.5), 0 0 0 2px var(--walnut-dark);
  pointer-events:none;
  white-space:nowrap;
}
.drag-hover .tri{filter:brightness(1.7) saturate(1.3) !important; box-shadow:0 0 0 3px #fff !important;}
.drag-ghost{
  position:fixed;
  z-index:999;
  pointer-events:none;
  opacity:.9;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.6));
}

.point-label{
  position:absolute;
  font-size:8px;
  color:rgba(233,220,192,.5);
  font-weight:600;
  left:50%; transform:translateX(-50%);
  z-index:3;
}
.tri-row.top .point-label{top:1px;}
.tri-row.bottom .point-label{bottom:1px;}

.checkers{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
  min-height:0;
  padding:2px 0;
}
.tri-row.bottom .checkers{flex-direction:column-reverse;}

.checker{
  width:80%;
  aspect-ratio:1/1;
  max-width:60px;
  border-radius:50%;
  margin-top:-48%;
  box-shadow:0 2px 3px rgba(0,0,0,.55), inset 0 2px 3px rgba(255,255,255,.25), inset 0 -3px 4px rgba(0,0,0,.35);
  position:relative;
}
.tri-row.bottom .checker{margin-top:0; margin-bottom:-48%;}
.checkers .checker:first-child{margin-top:0; margin-bottom:0;}
.checker.w{background:radial-gradient(circle at 35% 28%, var(--checker-w), var(--checker-w-shadow));border:1px solid #8c7a54;}
.checker.b{background:radial-gradient(circle at 35% 28%, #3f342b, var(--checker-b));border:1px solid #000;}
.checker:not(.top-count)::after{
  content:'♛';
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-size:52%;
  opacity:.32;
}
.checker.w::after{color:var(--walnut-dark);}
.checker.b::after{color:var(--cream);}
.checker.top-count{
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; font-family:var(--font-body);
}
.checker.w.top-count{color:var(--walnut-dark);}
.checker.b.top-count{color:var(--cream);}

/* ---------- bar strip (the gap between the two panels) ---------- */
.bar-strip{
  flex:0 0 24px;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  position:relative;
  padding:4px 0;
}
.bar-hinge{
  position:absolute;
  left:50%; top:4px; bottom:4px;
  width:6px;
  transform:translateX(-50%);
  background:repeating-linear-gradient(
    180deg,
    var(--brass) 0px, var(--brass) 3px,
    transparent 3px, transparent 10px
  );
  opacity:.55;
  border-radius:3px;
}
.bar-slot{
  flex:1 1 0;
  min-height:0;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  overflow:hidden;
  position:relative;
  z-index:2;
  cursor:pointer;
  border-radius:8px;
  touch-action:none;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
}
.bar-slot.highlight{box-shadow:0 0 0 2px var(--brass-bright); background:rgba(224,189,125,.15);}
.bar-slot.selected{box-shadow:0 0 0 2px #fff;}
.bar-slot .checker{width:70%; max-width:34px; margin:0 !important;}

/* ---------- off strip ---------- */
.off-strip{
  flex:0 0 clamp(34px, 10vw, 46px);
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:5px;
}
.off-tray{
  flex:1 1 0;
  min-height:0;
  background:linear-gradient(160deg,var(--walnut-light),var(--walnut-dark));
  border-radius:8px;
  box-shadow:inset 0 0 0 2px rgba(193,154,85,.35), inset 0 0 12px rgba(0,0,0,.5);
  display:flex;
  flex-wrap:wrap;
  align-content:flex-start;
  gap:2px;
  padding:4px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}
.off-tray.highlight{box-shadow:inset 0 0 0 2px var(--brass-bright), 0 0 10px var(--brass-bright);}
.off-tray .checker{width:38%; max-width:16px; margin:0;}
.off-tray .label{position:absolute; bottom:1px; left:50%; transform:translateX(-50%); font-size:7px; letter-spacing:.06em; color:var(--ink-dim); font-family:var(--font-body);}

/* ---------- dice / on-board buttons ---------- */
.dice-area{display:flex; align-items:center; gap:4px; flex-wrap:wrap; justify-content:center;}
.die{
  width:clamp(22px, 7vw, 30px);
  height:clamp(22px, 7vw, 30px);
  border-radius:6px;
  background:linear-gradient(160deg,var(--cream),var(--cream-dim));
  box-shadow:0 3px 8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.6);
  display:flex; align-items:center; justify-content:center;
  font-size:clamp(14px, 5vw, 19px);
  color:var(--walnut-dark);
  flex:0 0 auto;
}
.die.used{opacity:.28; filter:grayscale(.6);}
.die.rolling{animation:spin .5s linear infinite;}
@keyframes spin{ from{transform:rotate(0deg) scale(1);} 50%{transform:rotate(180deg) scale(1.08);} to{transform:rotate(360deg) scale(1);} }

.board-btn{
  font-family:var(--font-body);
  font-weight:700;
  font-size:clamp(11px, 3.4vw, 13px);
  border:none;
  border-radius:999px;
  padding:clamp(6px,2vw,10px) clamp(12px,4vw,22px);
  cursor:pointer;
  letter-spacing:.02em;
  background:linear-gradient(160deg,var(--brass-bright),var(--brass));
  color:var(--walnut-dark);
  box-shadow:0 4px 12px rgba(193,154,85,.4);
  transition:transform .08s, opacity .15s;
  flex:0 0 auto;
  white-space:nowrap;
}
.board-btn:active{transform:scale(.95);}
.hidden{display:none !important;}

/* ---------- bottom controls ---------- */
.controls{
  flex:0 0 auto;
  width:100%;
  max-width:560px;
  padding:4px 16px calc(8px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}
.btn-row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
button{-webkit-tap-highlight-color:transparent;}
.btn-ghost{
  font-family:var(--font-body);
  font-weight:600;
  font-size:13px;
  border:1px solid rgba(233,220,192,.25);
  border-radius:999px;
  padding:8px 18px;
  cursor:pointer;
  background:rgba(255,255,255,.06);
  color:var(--ink);
  transition:transform .08s, background .15s;
}
.btn-ghost:active{transform:scale(.96);}
.btn-ghost:disabled{opacity:.35; cursor:default; transform:none;}
.message{
  min-height:16px;
  font-size:12px;
  color:var(--brass-bright);
  text-align:center;
  font-weight:600;
  letter-spacing:.01em;
}

/* ---------- win overlay ---------- */
.overlay{
  position:fixed; inset:0;
  background:rgba(8,6,4,.82);
  display:flex; align-items:center; justify-content:center;
  z-index:50;
  padding:20px;
}
.overlay.hidden{display:none;}
.overlay-card{
  background:linear-gradient(160deg,var(--walnut-light),var(--walnut-dark));
  border-radius:16px;
  padding:32px 28px;
  max-width:360px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.6), inset 0 0 0 1px rgba(193,154,85,.4);
}
.overlay-card h2{
  font-family:var(--font-display);
  color:var(--brass-bright);
  font-size:26px;
  margin:0 0 10px;
}
.overlay-card p{color:var(--ink-dim); font-size:14px; line-height:1.5; margin:0 0 20px;}
.overlay-card .btn-primary{
  font-family:var(--font-body); font-weight:700; font-size:14px; border:none; border-radius:999px;
  padding:11px 26px; cursor:pointer;
  background:linear-gradient(160deg,var(--brass-bright),var(--brass)); color:var(--walnut-dark);
  box-shadow:0 4px 12px rgba(193,154,85,.35);
}
</style>
</head>
<body>

<div class="portrait-hint" id="portraitHint">
  <svg viewBox="0 0 24 24" fill="none" stroke="#e0bd7d" stroke-width="1.6"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M2 8v8M22 8v8" stroke-linecap="round"/></svg>
  <div style="font-family:var(--font-display); font-size:18px; color:var(--brass-bright);">Portrait mode only</div>
  <div style="font-size:13px; color:var(--ink-dim); max-width:240px;">This board is designed for portrait orientation. Please rotate your device back.</div>
</div>

<div class="table-wrap">
  <div class="player-card" id="cardTop">
    <div class="avatar-ring" id="ringTop"><div class="avatar b"></div></div>
    <div class="card-info">
      <div class="card-name">Black</div>
      <div class="card-sub">Pips <b id="pipBTop">167</b></div>
    </div>
  </div>

  <div class="boards-row">
    <div class="panel">
      <div class="tri-row top" id="rowLeftTop"></div>
      <div class="panel-mid" id="midLeft">
        <button class="board-btn" id="rollBtn">Roll</button>
      </div>
      <div class="tri-row bottom" id="rowLeftBottom"></div>
    </div>

    <div class="bar-strip" id="barStrip">
      <div class="bar-hinge"></div>
      <div class="bar-slot" id="barSlotB"></div>
      <div class="bar-slot" id="barSlotW"></div>
    </div>

    <div class="panel">
      <div class="tri-row top" id="rowRightTop"></div>
      <div class="panel-mid" id="midRight">
        <div class="dice-area" id="diceArea"></div>
        <button class="board-btn hidden" id="doneBtn">Done</button>
      </div>
      <div class="tri-row bottom" id="rowRightBottom"></div>
    </div>

    <div class="off-strip">
      <div class="off-tray" id="offB"><span class="label">OFF</span></div>
      <div class="off-tray" id="offW"><span class="label">OFF</span></div>
    </div>
  </div>

  <div class="player-card" id="cardBottom">
    <div class="avatar-ring" id="ringBottom"><div class="avatar w"></div></div>
    <div class="card-info">
      <div class="card-name">White</div>
      <div class="card-sub">Pips <b id="pipWBottom">167</b></div>
    </div>
  </div>
</div>

<div class="controls">
  <div class="message" id="message">Roll the dice to begin.</div>
  <div class="btn-row">
    <button class="btn-ghost" id="undoBtn" disabled>Undo Move</button>
    <button class="btn-ghost" id="newBtn">New Game</button>
  </div>
</div>

<div class="overlay hidden" id="winOverlay">
  <div class="overlay-card">
    <h2 id="winTitle">White wins!</h2>
    <p id="winSub">All fifteen checkers borne off. Well played.</p>
    <button class="btn-primary" id="playAgainBtn">Play Again</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ================= GAME STATE ================= */
const DIE_FACES = {1:'⚀',2:'⚁',3:'⚂',4:'⚃',5:'⚄',6:'⚅'};

let GEN_COUNTER = 0;
function freshState(){
  const points = new Array(25).fill(null).map(()=>({owner:null,count:0}));
  points[24] = {owner:'w', count:2};
  points[13] = {owner:'w', count:5};
  points[8]  = {owner:'w', count:3};
  points[6]  = {owner:'w', count:5};
  points[1]  = {owner:'b', count:2};
  points[12] = {owner:'b', count:5};
  points[17] = {owner:'b', count:3};
  points[19] = {owner:'b', count:5};
  return {
    gen: ++GEN_COUNTER,
    points,
    bar:{w:0,b:0},
    off:{w:0,b:0},
    current:'w',
    dice:[],
    rolledPair:[],
    turnRolled:false,
    selected:null,
    gameOver:false,
    history:[],
    passMessage:null
  };
}

let S = freshState();

function opp(p){ return p==='w' ? 'b' : 'w'; }
function dist(player, p){ return player==='w' ? p : 25-p; }
function homeMin(player){ return player==='w' ? 1 : 19; }
function homeMax(player){ return player==='w' ? 6 : 24; }
function inHome(player,p){ return p>=homeMin(player) && p<=homeMax(player); }

function isAllHome(player){
  if(S.bar[player] > 0) return false;
  for(let p=1;p<=24;p++){
    const pt = S.points[p];
    if(pt.owner===player && pt.count>0 && !inHome(player,p)) return false;
  }
  return true;
}

function destinationFor(player, src, die){
  if(src==='bar') return player==='w' ? 25-die : die;
  return player==='w' ? src-die : src+die;
}

function canLandOn(player, dest){
  const pt = S.points[dest];
  return pt.count===0 || pt.owner===player || (pt.count===1 && pt.owner===opp(player));
}

function maxHomeDist(player){
  let m=0;
  for(let p=1;p<=24;p++){
    const pt=S.points[p];
    if(pt.owner===player && pt.count>0) m = Math.max(m, dist(player,p));
  }
  return m;
}

function getLegalMoves(player, diceValues){
  const moves = [];
  const uniq = [...new Set(diceValues)];
  if(uniq.length===0) return moves;

  if(S.bar[player] > 0){
    for(const die of uniq){
      const dest = destinationFor(player,'bar',die);
      if(canLandOn(player,dest)){
        moves.push({src:'bar', die, dest, hit: S.points[dest].count===1 && S.points[dest].owner===opp(player)});
      }
    }
    return moves;
  }

  const home = isAllHome(player);
  const maxD = home ? maxHomeDist(player) : 0;

  for(let p=1;p<=24;p++){
    const pt = S.points[p];
    if(pt.owner!==player || pt.count===0) continue;
    for(const die of uniq){
      const dest = destinationFor(player,p,die);
      if(dest>=1 && dest<=24){
        if(canLandOn(player,dest)){
          moves.push({src:p, die, dest, hit: S.points[dest].count===1 && S.points[dest].owner===opp(player)});
        }
      } else if(home){
        const d = dist(player,p);
        if(die===d || (die>d && d===maxD)){
          moves.push({src:p, die, dest:'off', hit:false});
        }
      }
    }
  }
  return moves;
}

function snapshot(){
  return JSON.parse(JSON.stringify({
    points:S.points, bar:S.bar, off:S.off, current:S.current, dice:S.dice,
    rolledPair:S.rolledPair, turnRolled:S.turnRolled, selected:S.selected
  }));
}

function pushHistory(){
  S.history.push(snapshot());
}

function undoMove(){
  if(S.history.length===0) return;
  const snap = S.history.pop();
  S.points = snap.points; S.bar = snap.bar; S.off = snap.off; S.current = snap.current;
  S.dice = snap.dice; S.rolledPair = snap.rolledPair; S.turnRolled = snap.turnRolled;
  S.selected = null;
  setMessage('Move undone.');
  render();
}

function applyMove(move){
  pushHistory();
  const player = S.current;
  if(move.src==='bar') S.bar[player]--;
  else{
    S.points[move.src].count--;
    if(S.points[move.src].count===0) S.points[move.src].owner=null;
  }
  if(move.dest==='off'){
    S.off[player]++;
  } else {
    const pt = S.points[move.dest];
    if(pt.count===1 && pt.owner===opp(player)){
      S.bar[opp(player)]++;
      pt.owner = player; pt.count = 1;
    } else {
      pt.owner = player; pt.count++;
    }
  }
  const idx = S.dice.indexOf(move.die);
  S.dice.splice(idx,1);
}

function checkWinner(){
  if(S.off.w===15) return 'w';
  if(S.off.b===15) return 'b';
  return null;
}

/* ================= TURN FLOW ================= */
function startRoll(){
  if(S.gameOver || S.turnRolled) return;
  const dice = document.querySelectorAll('.die');
  rollBtn.disabled = true;
  let ticks = 0;
  const spin = setInterval(()=>{
    dice.forEach(d=>d.textContent = DIE_FACES[1+Math.floor(Math.random()*6)]);
    ticks++;
    if(ticks>7){
      clearInterval(spin);
      finishRoll();
    }
  },60);
}

function finishRoll(){
  const a = 1+Math.floor(Math.random()*6);
  const b = 1+Math.floor(Math.random()*6);
  S.rolledPair = [a,b];
  S.dice = (a===b) ? [a,a,a,a] : [a,b];
  S.turnRolled = true;
  S.selected = null;
  S.history = [];

  const legal = getLegalMoves(S.current, S.dice);
  if(legal.length===0){
    setMessage(`${playerName(S.current)} rolled ${a}-${b} — no legal moves. Turn passes.`);
    render();
    const gen = S.gen;
    setTimeout(()=>{ if(S.gen!==gen) return; switchTurn(); render(); }, 1400);
  } else {
    setMessage(`${playerName(S.current)} rolled ${a}-${b}${a===b?' (doubles!)':''}. Select a checker to move.`);
    render();
  }
}

function switchTurn(){
  S.current = opp(S.current);
  S.dice = [];
  S.rolledPair = [];
  S.turnRolled = false;
  S.selected = null;
  S.history = [];
  if(!S.gameOver) setMessage(`${playerName(S.current)} to roll.`);
}

function forceEndTurn(){
  if(!S.turnRolled || S.gameOver) return;
  S.dice = [];
  setMessage(`${playerName(S.current)} ended their turn.`);
  switchTurn();
  render();
}

function afterMove(){
  const winner = checkWinner();
  if(winner){
    S.gameOver = true;
    showWin(winner);
    render();
    return;
  }
  const legal = getLegalMoves(S.current, S.dice);
  if(S.dice.length===0){
    setMessage(`${playerName(S.current)}'s turn is complete.`);
    const gen = S.gen;
    setTimeout(()=>{ if(S.gen!==gen) return; switchTurn(); render(); }, 700);
  } else if(legal.length===0){
    setMessage(`No more legal moves for ${playerName(S.current)}. Turn passes.`);
    const gen = S.gen;
    setTimeout(()=>{ if(S.gen!==gen) return; switchTurn(); render(); }, 1200);
  } else {
    setMessage('Select your next move.');
  }
  render();
}

function playerName(p){ return p==='w' ? 'White' : 'Black'; }

/* ================= INTERACTION ================= */
function legalMovesFrom(source){
  return getLegalMoves(S.current, S.dice).filter(m=>m.src===source);
}

// Selecting a source auto-plays it immediately if it has exactly one legal
// destination (nothing to choose between), otherwise highlights the options.
function selectSource(source){
  if(S.gameOver || !S.turnRolled){ if(!S.turnRolled) setMessage('Roll the dice first.'); return; }
  const player = S.current;

  if(source !== 'bar'){
    if(S.bar[player] > 0){ setMessage('You must enter from the bar first.'); return; }
    const pt = S.points[source];
    if(!(pt.owner===player && pt.count>0)) return;
  } else {
    if(S.bar[player] <= 0) return;
  }

  const moves = legalMovesFrom(source);
  if(moves.length===0){
    S.selected = null;
    setMessage('No legal moves for that checker.');
    render();
    return;
  }
  if(moves.length===1){
    S.selected = null;
    applyMove(moves[0]);
    afterMove();
    return;
  }
  S.selected = source;
  render();
}

function attemptMove(source, dest){
  if(S.gameOver || !S.turnRolled) return false;
  const move = legalMovesFrom(source).find(m=>m.dest===dest);
  if(!move) return false;
  S.selected = null;
  applyMove(move);
  afterMove();
  return true;
}

function onPointClick(p){
  if(S.gameOver || !S.turnRolled) { if(!S.turnRolled) setMessage('Roll the dice first.'); return; }
  const player = S.current;

  if(S.bar[player] > 0){
    if(p==='bar'){ selectSource('bar'); return; }
    if(S.selected==='bar' && attemptMove('bar', p)) return;
    setMessage('You must enter from the bar first.');
    return;
  }

  if(p==='bar') return;

  if(S.selected===null){
    selectSource(p);
    return;
  }

  if(S.selected===p){
    S.selected = null;
    render();
    return;
  }

  if(attemptMove(S.selected, p)) return;

  const pt = S.points[p];
  if(pt.owner===player && pt.count>0){
    selectSource(p);
    return;
  }

  setMessage('That move isn\'t legal.');
}

function onOffClick(player){
  if(S.gameOver || !S.turnRolled) return;
  if(player !== S.current) return;
  if(S.selected===null) return;
  if(!attemptMove(S.selected, 'off')){
    setMessage('You can only bear off once all your checkers are home.');
  }
}

function onBarSlotClick(color){
  if(color !== S.current){
    setMessage(`It's not ${playerName(color)}'s turn.`);
    return;
  }
  onPointClick('bar');
}

/* ================= DRAG & DROP ================= */
let drag = null;
let dragHoverEl = null;

function attachDragSource(el, source, tapHandler){
  const handler = tapHandler || (()=>onPointClick(source));
  el.addEventListener('pointerdown', (e)=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    if(S.gameOver || !S.turnRolled){ handler(); return; }
    drag = {source, startX:e.clientX, startY:e.clientY, dragging:false, ghost:null, tapHandler:handler};
  });
}

function findDropTarget(x,y){
  const el = document.elementFromPoint(x,y);
  if(!el) return null;
  const pointEl = el.closest('[data-point]');
  if(pointEl) return parseInt(pointEl.dataset.point, 10);
  if(el.closest('.off-tray')) return 'off';
  return null;
}

function updateDragHover(x,y){
  const el = document.elementFromPoint(x,y);
  const pointEl = el && el.closest('[data-point]');
  const offEl = el && el.closest('.off-tray');
  const targetEl = pointEl || offEl || null;
  if(targetEl === dragHoverEl) return;
  if(dragHoverEl){ dragHoverEl.classList.remove('drag-hover'); dragHoverEl = null; }
  if(!targetEl || !drag) return;
  const destVal = pointEl ? parseInt(pointEl.dataset.point, 10) : 'off';
  if(legalMovesFrom(drag.source).some(m=>m.dest===destVal)){
    targetEl.classList.add('drag-hover');
    dragHoverEl = targetEl;
  }
}

function clearDragHover(){
  if(dragHoverEl){ dragHoverEl.classList.remove('drag-hover'); dragHoverEl = null; }
}

document.addEventListener('pointermove', (e)=>{
  if(!drag) return;
  const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
  if(!drag.dragging && Math.hypot(dx,dy) > 10){
    drag.dragging = true;
    const diceBefore = S.dice.length;
    selectSource(drag.source);
    if(S.dice.length !== diceBefore || S.selected !== drag.source){
      // an auto-move fired, or the source wasn't actually selectable — nothing to drag
      drag = null;
      return;
    }
    const color = (drag.source==='bar') ? S.current : S.points[drag.source].owner;
    const g = document.createElement('div');
    g.className = 'checker drag-ghost ' + color;
    g.style.width = '42px';
    g.style.height = '42px';
    document.body.appendChild(g);
    drag.ghost = g;
  }
  if(drag && drag.dragging && drag.ghost){
    drag.ghost.style.left = (e.clientX - 21) + 'px';
    drag.ghost.style.top = (e.clientY - 21) + 'px';
    updateDragHover(e.clientX, e.clientY);
  }
});

document.addEventListener('pointerup', (e)=>{
  if(!drag) return;
  const wasDragging = drag.dragging;
  const source = drag.source;
  const tapHandler = drag.tapHandler;
  if(wasDragging){
    const dest = findDropTarget(e.clientX, e.clientY);
    if(dest !== null) attemptMove(source, dest);
    if(drag.ghost) drag.ghost.remove();
    clearDragHover();
    drag = null;
    render();
  } else {
    drag = null;
    tapHandler();
  }
});

document.addEventListener('pointercancel', ()=>{
  if(drag && drag.ghost) drag.ghost.remove();
  clearDragHover();
  drag = null;
});

/* ================= RENDER ================= */
const rowLeftTop = document.getElementById('rowLeftTop');
const rowLeftBottom = document.getElementById('rowLeftBottom');
const rowRightTop = document.getElementById('rowRightTop');
const rowRightBottom = document.getElementById('rowRightBottom');
const barSlotB = document.getElementById('barSlotB');
const barSlotW = document.getElementById('barSlotW');
const offWEl = document.getElementById('offW');
const offBEl = document.getElementById('offB');
const diceArea = document.getElementById('diceArea');
const messageEl = document.getElementById('message');
const rollBtn = document.getElementById('rollBtn');
const doneBtn = document.getElementById('doneBtn');
const undoBtn = document.getElementById('undoBtn');
const newBtn = document.getElementById('newBtn');
const ringTop = document.getElementById('ringTop');
const ringBottom = document.getElementById('ringBottom');
const pipBTopEl = document.getElementById('pipBTop');
const pipWBottomEl = document.getElementById('pipWBottom');
const winOverlay = document.getElementById('winOverlay');

const LEFT_TOP = [13,14,15,16,17,18];
const LEFT_BOTTOM = [12,11,10,9,8,7];
const RIGHT_TOP = [19,20,21,22,23,24];
const RIGHT_BOTTOM = [6,5,4,3,2,1];

function setMessage(msg){ S.passMessage = msg; messageEl.textContent = msg; }

function currentLegalTargets(){
  if(S.selected===null || !S.turnRolled) return [];
  const moves = getLegalMoves(S.current, S.dice).filter(m=>m.src===S.selected);
  return moves.map(m=>m.dest);
}

function makeCheckerStack(owner, count, capForBadge){
  const frag = document.createDocumentFragment();
  const max = capForBadge || 5;
  const show = Math.min(count, max);
  for(let i=0;i<show;i++){
    const c = document.createElement('div');
    c.className = 'checker ' + owner;
    if(i===show-1 && count>max){
      c.classList.add('top-count');
      c.textContent = count;
    }
    frag.appendChild(c);
  }
  return frag;
}

function buildPointEl(pNum, targets){
  const div = document.createElement('div');
  const colorClass = (pNum % 2 === 0) ? 'cream' : 'wine';
  div.className = 'point ' + colorClass;
  div.dataset.point = pNum;
  if(S.selected===pNum) div.classList.add('selected');
  if(targets.includes(pNum)) div.classList.add('highlight');

  const tri = document.createElement('div');
  tri.className = 'tri';
  div.appendChild(tri);

  const label = document.createElement('div');
  label.className = 'point-label';
  label.textContent = pNum;
  div.appendChild(label);

  const stack = document.createElement('div');
  stack.className = 'checkers';
  const pt = S.points[pNum];
  if(pt.count>0){
    stack.appendChild(makeCheckerStack(pt.owner, pt.count, 5));
  }
  div.appendChild(stack);

  if(targets.includes(pNum) && S.selected!==null){
    const dieVals = [...new Set(legalMovesFrom(S.selected).filter(m=>m.dest===pNum).map(m=>m.die))].sort((a,b)=>a-b);
    const badge = document.createElement('div');
    badge.className = 'target-badge';
    badge.textContent = dieVals.join(',');
    div.appendChild(badge);
  }

  attachDragSource(div, pNum);
  return div;
}

function render(){
  rowLeftTop.innerHTML = '';
  rowLeftBottom.innerHTML = '';
  rowRightTop.innerHTML = '';
  rowRightBottom.innerHTML = '';

  const targets = currentLegalTargets();
  const offTarget = targets.includes('off');

  LEFT_TOP.forEach(p=>rowLeftTop.appendChild(buildPointEl(p, targets)));
  LEFT_BOTTOM.forEach(p=>rowLeftBottom.appendChild(buildPointEl(p, targets)));
  RIGHT_TOP.forEach(p=>rowRightTop.appendChild(buildPointEl(p, targets)));
  RIGHT_BOTTOM.forEach(p=>rowRightBottom.appendChild(buildPointEl(p, targets)));

  // bar
  barSlotB.querySelectorAll('.checker').forEach(e=>e.remove());
  barSlotW.querySelectorAll('.checker').forEach(e=>e.remove());
  if(S.bar.b>0) barSlotB.appendChild(makeCheckerStack('b', S.bar.b, 6));
  if(S.bar.w>0) barSlotW.appendChild(makeCheckerStack('w', S.bar.w, 6));
  const barActionable = S.turnRolled && !S.gameOver;
  barSlotB.classList.toggle('highlight', barActionable && S.current==='b' && S.bar.b>0 && S.selected===null);
  barSlotW.classList.toggle('highlight', barActionable && S.current==='w' && S.bar.w>0 && S.selected===null);
  barSlotB.classList.toggle('selected', S.current==='b' && S.selected==='bar');
  barSlotW.classList.toggle('selected', S.current==='w' && S.selected==='bar');

  // off trays
  offWEl.querySelectorAll('.checker').forEach(e=>e.remove());
  offBEl.querySelectorAll('.checker').forEach(e=>e.remove());
  offWEl.querySelectorAll('.target-badge').forEach(e=>e.remove());
  offBEl.querySelectorAll('.target-badge').forEach(e=>e.remove());
  if(S.off.w>0) offWEl.insertBefore(makeCheckerStack('w', S.off.w, 15), offWEl.firstChild);
  if(S.off.b>0) offBEl.insertBefore(makeCheckerStack('b', S.off.b, 15), offBEl.firstChild);
  offWEl.classList.toggle('highlight', S.selected!==null && S.current==='w' && offTarget);
  offBEl.classList.toggle('highlight', S.selected!==null && S.current==='b' && offTarget);
  if(offTarget && S.selected!==null){
    const dieVals = [...new Set(legalMovesFrom(S.selected).filter(m=>m.dest==='off').map(m=>m.die))].sort((a,b)=>a-b);
    const badge = document.createElement('div');
    badge.className = 'target-badge';
    badge.textContent = dieVals.join(',');
    (S.current==='w' ? offWEl : offBEl).appendChild(badge);
  }

  // dice
  diceArea.innerHTML = '';
  if(S.turnRolled){
    const values = S.rolledPair.length===2 && S.rolledPair[0]===S.rolledPair[1]
      ? [S.rolledPair[0],S.rolledPair[0],S.rolledPair[0],S.rolledPair[0]]
      : S.rolledPair;
    const remaining = [...S.dice];
    values.forEach(v=>{
      const die = document.createElement('div');
      die.className = 'die';
      die.textContent = DIE_FACES[v] || v;
      const at = remaining.indexOf(v);
      if(at>=0){ remaining.splice(at,1); } else { die.classList.add('used'); }
      diceArea.appendChild(die);
    });
  }

  // roll / done buttons
  rollBtn.classList.toggle('hidden', S.gameOver || S.turnRolled);
  rollBtn.disabled = S.gameOver || S.turnRolled;
  doneBtn.classList.toggle('hidden', S.gameOver || !S.turnRolled);

  // player cards
  ringTop.classList.toggle('active', S.current==='b' && !S.gameOver);
  ringBottom.classList.toggle('active', S.current==='w' && !S.gameOver);
  pipBTopEl.textContent = pipCount('b');
  pipWBottomEl.textContent = pipCount('w');

  undoBtn.disabled = S.history.length===0 || S.gameOver;
}

function pipCount(player){
  let total = S.bar[player] * 25;
  for(let p=1;p<=24;p++){
    const pt = S.points[p];
    if(pt.owner===player) total += pt.count * dist(player,p);
  }
  return total;
}

function showWin(winner){
  document.getElementById('winTitle').textContent = playerName(winner) + ' wins!';
  document.getElementById('winSub').textContent = 'All fifteen checkers borne off. Well played.';
  winOverlay.classList.remove('hidden');
}

/* ================= WIRE UP ================= */
rollBtn.addEventListener('click', startRoll);
doneBtn.addEventListener('click', forceEndTurn);
undoBtn.addEventListener('click', undoMove);
newBtn.addEventListener('click', ()=>{
  S = freshState();
  winOverlay.classList.add('hidden');
  setMessage('Roll the dice to begin.');
  render();
});
document.getElementById('playAgainBtn').addEventListener('click', ()=>{
  S = freshState();
  winOverlay.classList.add('hidden');
  setMessage('Roll the dice to begin.');
  render();
});
offWEl.addEventListener('click', ()=>onOffClick('w'));
offBEl.addEventListener('click', ()=>onOffClick('b'));
attachDragSource(barSlotB, 'bar', ()=>onBarSlotClick('b'));
attachDragSource(barSlotW, 'bar', ()=>onBarSlotClick('w'));

document.getElementById('portraitHint').classList.add('show');

render();

/* ================= best-effort portrait lock ================= */
if(screen.orientation && screen.orientation.lock){
  screen.orientation.lock('portrait').catch(()=>{ /* only works fullscreen/standalone; ignore otherwise */ });
}

/* ================= PWA: service worker ================= */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{ /* offline registration may fail in sandboxed preview */ });
  });
}
})();
</script>
</body>
</html>
